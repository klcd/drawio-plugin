name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check out pinned draw.io source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jgraph/drawio
          ref: 84487b4891cbc0f32d7e30f34cf878c87cb1f414
          path: .cache/drawio
          sparse-checkout: |
            LICENSE
            VERSION
            src/main/webapp
          sparse-checkout-cone-mode: false

      - name: Rebuild committed editor
        run: npm run build
        env:
          DRAWIO_DIR: ${{ github.workspace }}/.cache/drawio

      - name: Verify generated files are current
        run: git diff --exit-code -- THIRD_PARTY_NOTICES.txt editor/

      - name: Run static and plugin checks
        run: npm run check

      - name: Install Chromium and system libraries
        run: npx playwright install --with-deps chromium

      - name: Run Chromium integration tests
        run: npm run test:browser

      - name: Run Electron clipboard test
        run: xvfb-run -a npm run test:electron
